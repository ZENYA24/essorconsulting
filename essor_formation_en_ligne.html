  <div class="topbar-in">
    <a href="#" class="logo" onclick="go('dashboard');return false;">
      <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="23" stroke="#97b425" stroke-width="2"/><path d="M12 30 L18 18 L24 26 L30 14 L36 22" stroke="#97b425" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="22" r="3" fill="#97b425"/></svg>
      <span class="logo-t"><span class="l1">ESSOR</span><span class="l2">FORMATION EN LIGNE</span></span>
    </a>
    <div class="userbox hidden" id="userbox">
      <div class="avatar" id="avatar">?</div>
      <span id="username"></span>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </div>
</div>

<div class="wrap" id="app"></div>

<footer>© 2026 Groupe ESSOR — <b>Essor Consulting Group</b> &amp; <b>ESSOR Cleaning Academy™</b> · 647 678 4228 · essor3cons@gmail.com</footer>

<script>
const COURSES = [{"id":"cleaning-p1","badge":"ESSOR Cleaning Academy™","title":"Programme 1 — Foundations of Professional Cleaning","desc":"La formation complète de 2 jours (16 heures) pour débuter dans le nettoyage professionnel : industrie, produits, techniques, sécurité, service à la clientèle et certification.","duration":"16 heures","level":"Débutant","modules":[{"num":1,"title":"Bienvenue dans l'industrie du nettoyage professionnel","duree":"2 heures","objectifs":["Comprendre l'industrie du nettoyage professionnel","Connaître les différents secteurs d'activité","Identifier les qualités d'un professionnel du nettoyage","Comprendre le rôle du nettoyeur commercial"],"chapters":[{"title":"Mot du fondateur","content":[["Pourquoi ESSOR Cleaning Academy ?","ESSOR Cleaning Academy est né d'un constat simple : le nettoyage professionnel est un métier essentiel, trop souvent sous-estimé et peu valorisé, alors qu'il exige de vraies compétences techniques, de la rigueur et un grand sens du service. Notre académie a été créée pour redonner à ce métier la reconnaissance qu'il mérite, et pour offrir à chaque participant un vrai tremplin : un emploi stable, puis, pour ceux qui le souhaitent, leur propre entreprise."],["Notre mission","Former des professionnels compétents, fiers de leur métier, et outiller les entrepreneurs de demain avec les connaissances, les outils et l'accompagnement nécessaires pour réussir dans l'industrie du nettoyage commercial."],["Notre vision","Devenir la référence en formation professionnelle dans l'industrie du nettoyage au Canada, reconnue pour l'excellence de ses diplômés et la réussite des entreprises qu'elle a contribué à lancer."],["Notre philosophie","Apprendre en faisant. Chaque participant progresse à son rythme, dans un environnement pratique, bienveillant et exigeant à la fois. Aucun participant n'est laissé pour compte : la réussite de chacun contribue à la réussite collective de la communauté ESSOR."]]},{"title":"L'industrie du nettoyage au Canada","content":[["Historique","Longtemps perçu comme un travail informel et peu structuré, le nettoyage professionnel s'est transformé en une véritable industrie de services au cours des dernières décennies. L'arrivée de normes reconnues (comme les standards ISSA et CIMS), la professionnalisation des équipes et une attention accrue à l'hygiène — accélérée par la pandémie — ont fait de ce secteur un domaine en pleine croissance et de plus en plus exigeant sur le plan des compétences."],["Les chiffres du marché","Selon les estimations de l'industrie, le nettoyage commercial et résidentiel représente aujourd'hui l'un des plus importants secteurs d'emploi au sein des services aux entreprises au Canada, avec une demande constante d'entreprises et de travailleurs qualifiés. La croissance de l'immobilier commercial, le vieillissement de la population et les nouvelles exigences sanitaires continuent d'alimenter cette demande."],["Les différents employeurs","Les diplômés peuvent travailler pour des entreprises de nettoyage commercial, des sociétés de gestion immobilière, des établissements de santé, des institutions scolaires ou gouvernementales, ou encore démarrer leur propre entreprise de nettoyage en tant que travailleur autonome ou entrepreneur."],["Les perspectives de carrière","Le parcours typique mène du poste de nettoyeur à celui de superviseur d'équipe, puis de gestionnaire de contrat, avec la possibilité, à terme, de devenir propriétaire de sa propre entreprise de nettoyage commercial — exactement le parcours proposé par les filières Opérations et Entrepreneuriat d'ESSOR Cleaning Academy™."]]},{"title":"Les secteurs d'activité","content":[["Bureaux","Entretien courant des espaces de travail, salles de réunion, cuisinettes et sanitaires, généralement en dehors des heures d'ouverture."],["Immeubles résidentiels","Entretien des aires communes (halls, corridors, ascenseurs, buanderies) dans les copropriétés et immeubles à logements multiples."],["Garderies","Désinfection renforcée et produits adaptés à la présence d'enfants en bas âge, avec une attention particulière à la sécurité des produits utilisés."],["Écoles","Entretien des salles de classe, gymnases, cafétérias et sanitaires, souvent selon un horaire strict entre les périodes scolaires."],["Centres communautaires","Entretien d'espaces polyvalents à fort achalandage, nécessitant flexibilité et réactivité."],["Résidences pour personnes âgées","Normes d'hygiène élevées, sensibilité aux produits utilisés, attention et respect envers une clientèle vulnérable."],["Refuges","Environnements exigeant rigueur sanitaire, discrétion et une approche humaine et respectueuse."],["Commerces","Entretien d'espaces de vente, vitrines et aires de service à la clientèle, souvent en dehors des heures d'affaires."],["Entrepôts","Grandes surfaces, entretien des planchers industriels, gestion de la poussière et des débris."],["Industrie légère","Entretien d'espaces de production, avec des exigences particulières liées à la sécurité et parfois à des protocoles spécifiques (aires alimentaires, zones contrôlées)."]]},{"title":"Le rôle du professionnel","content":[["Responsabilités","Exécuter les tâches assignées selon les standards de qualité établis, respecter les horaires et signaler toute anomalie (bris, dommage, produit manquant)."],["Attitude","Faire preuve de rigueur, d'autonomie et d'une attitude positive, même face aux imprévus ou aux tâches répétitives."],["Présentation","Porter une tenue propre et appropriée, respecter les normes d'hygiène personnelle et représenter dignement l'entreprise chez le client."],["Communication","Échanger clairement avec les collègues, les superviseurs et les clients, et signaler rapidement tout problème rencontré."],["Travail d'équipe","Collaborer efficacement avec les autres membres de l'équipe, partager l'information utile et s'entraider pour respecter les échéanciers."],["Éthique","Faire preuve d'honnêteté, respecter le matériel et les lieux du client, et ne jamais s'approprier de biens ou d'informations rencontrés sur les lieux de travail."],["Confidentialité","Respecter la vie privée du client et de ses occupants, ne jamais divulguer ou utiliser des informations vues ou entendues durant un mandat."]]}],"activity":{"label":"Atelier","title":"Pourquoi avez-vous choisi cette profession ?","steps":["En groupe ou individuellement, chaque participant partage en 2 à 3 minutes ce qui l'a motivé à suivre cette formation.","Le formateur anime une discussion sur les motivations communes du groupe et les relie aux qualités professionnelles vues au chapitre 4.","Objectif : créer un sentiment d'appartenance dès le départ et donner du sens à l'apprentissage."]},"quiz":[["Quelle est la mission d'ESSOR Cleaning Academy™ ?",["Vendre des produits de nettoyage","Former des professionnels et outiller les entrepreneurs","Gérer des immeubles","Offrir des services de sécurité"],1],["Quel évènement récent a accéléré la professionnalisation de l'industrie du nettoyage ?",["La crise financière de 2008","La pandémie","L'automatisation","La déréglementation du travail"],1],["Lequel n'est PAS un employeur typique d'un diplômé en nettoyage professionnel ?",["Entreprise de nettoyage commercial","Établissement de santé","Agence de voyage","Institution scolaire"],2],["Quel est le parcours de carrière typique dans l'industrie ?",["Nettoyeur → superviseur → gestionnaire de contrat → entrepreneur","Superviseur → nettoyeur","Entrepreneur → nettoyeur","Aucun avancement possible"],0],["Dans quel secteur la désinfection renforcée et la sécurité des produits sont-elles particulièrement importantes ?",["Entrepôts","Garderies","Bureaux","Commerces"],1],["Quelle qualité concerne le respect de la vie privée du client ?",["Ponctualité","Confidentialité","Présentation","Travail d'équipe"],1],["Que doit faire un professionnel qui constate un bris chez un client ?",["L'ignorer","Le réparer lui-même sans le signaler","Le signaler à son superviseur","Le cacher"],2],["Quel secteur nécessite une attention particulière envers une clientèle vulnérable et âgée ?",["Résidences pour personnes âgées","Entrepôts","Industrie légère","Bureaux"],0],["Laquelle de ces attitudes est attendue d'un professionnel du nettoyage ?",["Attitude négative face aux imprévus","Autonomie et rigueur","Indifférence aux horaires","Manque de communication"],1],["Quelle est la philosophie pédagogique d'ESSOR Cleaning Academy™ ?",["Apprendre uniquement par la théorie","Apprendre en faisant","Apprentissage individuel sans accompagnement","Aucune philosophie particulière"],1]]},{"num":2,"title":"Santé, sécurité et prévention","duree":"2 heures","objectifs":["Comprendre les risques liés au métier","Prévenir les accidents de travail","Travailler en toute sécurité au quotidien"],"chapters":[{"title":"Introduction à la santé sécurité","content":["La santé et la sécurité au travail (SST) visent à protéger l'intégrité physique et psychologique des travailleurs. Dans le domaine du nettoyage, les risques sont nombreux : produits chimiques, équipement, surfaces glissantes, manutention. Chaque professionnel a la responsabilité de connaître ces risques, d'appliquer les mesures de prévention et de signaler toute situation dangereuse à son superviseur."]},{"title":"SIMDUT (WHMIS)","content":["Le Système d'information sur les matières dangereuses utilisées au travail (SIMDUT) encadre l'étiquetage et la communication des dangers liés aux produits chimiques. Chaque produit dangereux doit porter une étiquette normalisée avec pictogrammes, et être accompagné d'une fiche de données de sécurité (FDS) précisant sa composition, ses dangers et les mesures d'urgence à connaître avant toute utilisation."]},{"title":"Produits chimiques","content":["Certains produits de nettoyage peuvent être irritants, corrosifs ou toxiques s'ils sont mal utilisés ou mélangés. Il est essentiel de lire les étiquettes, de respecter les dilutions recommandées et de ne jamais mélanger deux produits sans connaître leur compatibilité, certains mélanges pouvant dégager des gaz dangereux."]},{"title":"Équipement de protection individuelle","content":["Les équipements de protection individuelle (EPI) — gants, lunettes, masques, chaussures antidérapantes — réduisent les risques d'exposition et de blessure. Le choix de l'EPI dépend de la tâche et du produit utilisé; il doit être inspecté avant chaque usage et remplacé dès qu'il est endommagé."]},{"title":"Prévention des glissades","content":["Les planchers mouillés sont une cause fréquente d'accident. Il faut toujours signaler les zones lavées à l'aide d'affiches ou de cônes, travailler par section pour laisser un passage sec, et porter des chaussures avec semelles antidérapantes."]},{"title":"Prévention des chutes","content":["Les chutes de hauteur (escabeau, escalier, surface en dénivelé) peuvent être évitées par l'utilisation d'équipement adéquat, la vérification de la stabilité avant de monter, et le respect des limites de charge et de hauteur recommandées par le fabricant."]},{"title":"Sécurité électrique","content":["L'utilisation d'équipement électrique (aspirateurs, autolaveuses) exige de vérifier l'état des fils et des prises avant chaque usage, d'éviter le contact avec l'eau, et de débrancher l'équipement avant tout entretien de la machine elle-même."]},{"title":"Manutention","content":["Le levage et le déplacement de charges (chariots, contenants, mobilier) doivent respecter des techniques sécuritaires : plier les genoux, garder le dos droit, rapprocher la charge du corps, et demander de l'aide pour les charges lourdes ou encombrantes."]},{"title":"Premiers soins","content":["En cas de blessure mineure, il est important de connaître l'emplacement de la trousse de premiers soins et la marche à suivre de base (nettoyer, protéger la plaie), tout en informant rapidement son superviseur pour toute blessure, même mineure."]},{"title":"Situations d'urgence","content":["Chaque lieu de travail possède des procédures d'urgence propres (incendie, évacuation, déversement majeur). Il est essentiel de connaître les sorties, les points de rassemblement et la personne à contacter en cas d'urgence avant de commencer un mandat."]},{"title":"Violence au travail","content":["La violence au travail peut prendre plusieurs formes : verbale, physique ou psychologique. Tout professionnel a le droit d'évoluer dans un environnement sécuritaire et doit signaler immédiatement toute situation de violence à son superviseur."]},{"title":"Harcèlement","content":["Le harcèlement, qu'il soit sexuel, psychologique ou discriminatoire, n'a pas sa place dans l'industrie. Les participants apprennent à reconnaître les comportements inacceptables et les recours disponibles pour signaler une situation de harcèlement."]},{"title":"Accessibilité (AODA)","content":["La Loi sur l'accessibilité pour les personnes handicapées de l'Ontario (AODA) impose des normes de service et d'accessibilité. Le professionnel du nettoyage doit être sensibilisé à ces normes, notamment lorsqu'il travaille dans des lieux fréquentés par des personnes en situation de handicap."]}],"activity":{"label":"Atelier","title":"Identifier les risques","steps":["À partir de photos ou de mises en situation présentées par le formateur, les participants identifient les risques présents (produit mal étiqueté, plancher mouillé non signalé, EPI manquant, etc.).","Cas pratique : en sous-groupes, les participants analysent un scénario d'accident évitable et proposent les mesures de prévention appropriées.","Retour en groupe et discussion des solutions proposées."]},"quiz":[["Que signifie SIMDUT ?",["Système d'inspection des matières dangereuses","Système d'information sur les matières dangereuses utilisées au travail","Service intégré de matériel dangereux","Aucune de ces réponses"],1],["Que doit-on trouver sur l'étiquette d'un produit dangereux ?",["Uniquement le prix","Des pictogrammes de danger normalisés","Le nom du fabricant seulement","Rien de particulier"],1],["Que faut-il vérifier avant de mélanger deux produits chimiques ?",["Leur couleur","Leur compatibilité","Leur odeur","Leur prix"],1],["Lequel de ces éléments est un équipement de protection individuelle ?",["Un chariot","Des gants","Une vadrouille","Un aspirateur"],1],["Comment doit-on signaler un plancher fraîchement lavé ?",["Ne rien faire","Avec une affiche ou un cône","En avertissant seulement à voix haute","Ce n'est pas nécessaire"],1],["Quelle est une bonne pratique avant de monter sur un escabeau ?",["Vérifier sa stabilité","L'utiliser peu importe son état","Monter rapidement","Ne rien vérifier"],0],["Avant d'utiliser un équipement électrique, il faut :",["L'utiliser immédiatement","Vérifier l'état des fils et des prises","Le mouiller","L'ignorer"],1],["Quelle est la bonne technique de levage d'une charge lourde ?",["Plier le dos, jambes droites","Plier les genoux, dos droit","Lever avec les bras seulement","Aucune technique particulière"],1],["Que doit-on faire en cas de blessure, même mineure ?",["L'ignorer","Informer son superviseur","Continuer le travail sans rien dire","Quitter sans avertir"],1],["Que doit-on connaître avant de commencer un mandat dans un nouvel édifice ?",["Les sorties et procédures d'urgence","Le nom de tous les employés","L'historique de l'entreprise","Rien de particulier"],0],["Que faire face à une situation de violence au travail ?",["Ne rien dire","La signaler immédiatement à son superviseur","Régler la situation seul avec violence","Quitter son emploi sans explication"],1],["Le harcèlement au travail peut être :",["Uniquement physique","Verbal, psychologique ou discriminatoire","Toujours sans conséquence","Acceptable si involontaire"],1],["Que signifie AODA ?",["Une norme de dilution des produits","Une loi sur l'accessibilité pour les personnes handicapées en Ontario","Un type d'équipement","Un syndicat"],1],["Quel est l'objectif principal de la santé et sécurité au travail ?",["Réduire les coûts","Protéger l'intégrité physique et psychologique des travailleurs","Augmenter la vitesse de travail","Aucun objectif particulier"],1],["Qui doit signaler une situation dangereuse observée sur les lieux de travail ?",["Uniquement le superviseur","Chaque professionnel du nettoyage","Personne","Seulement le client"],1],["Quel document accompagne un produit chimique dangereux ?",["Une facture","Une fiche de données de sécurité (FDS)","Un manuel d'utilisateur générique","Aucun document"],1],["Quel type de chaussures est recommandé pour prévenir les glissades ?",["Chaussures à talons","Chaussures avec semelles antidérapantes","Sandales","Peu importe le type"],1],["Que faut-il faire avant d'entretenir la partie électrique d'une machine ?",["La débrancher","La laisser branchée","L'utiliser sous l'eau","Rien de particulier"],0],["Quelle est une conséquence possible du non-respect des dilutions recommandées ?",["Aucun risque","Dégagement possible de gaz dangereux ou produit inefficace","Amélioration du résultat","Économie garantie"],1],["Quelle attitude est attendue si un participant est témoin de harcèlement envers un collègue ?",["Ignorer la situation","Encourager le comportement","Signaler la situation","Se moquer avec le groupe"],2]]},{"num":3,"title":"Produits de nettoyage","duree":"2 heures","objectifs":["Comprendre les différentes familles de produits","Choisir le bon produit selon la tâche","Éviter les erreurs d'utilisation et de mélange"],"chapters":[{"title":"Les différents produits","content":["Les produits de nettoyage se regroupent en grandes familles selon leur fonction : nettoyants généraux, désinfectants, dégraissants, décapants et neutralisants. Bien connaître ces familles permet de choisir le bon produit selon la surface et le résultat recherché, plutôt que d'utiliser un seul produit pour tout."]},{"title":"Le pH","content":["Le pH mesure le niveau d'acidité ou d'alcalinité d'un produit, sur une échelle de 0 à 14. Un produit acide (pH bas) est efficace contre le tartre et la rouille; un produit alcalin (pH élevé) est efficace contre la graisse. Connaître le pH permet d'éviter d'endommager certaines surfaces sensibles."]},{"title":"Les désinfectants","content":["Les désinfectants éliminent les bactéries, virus et autres micro-organismes présents sur une surface déjà nettoyée. Leur efficacité dépend du respect du temps de contact (dwell time) indiqué sur l'étiquette : appliquer, puis laisser agir le temps recommandé avant d'essuyer."]},{"title":"Les nettoyants","content":["Les nettoyants généraux retirent la saleté courante (poussière, traces, résidus légers) sans nécessairement désinfecter. Ils conviennent à l'entretien quotidien des surfaces peu à risque comme les bureaux ou les meubles."]},{"title":"Les dégraissants","content":["Les dégraissants sont conçus pour dissoudre les résidus gras, notamment en cuisine ou sur les équipements industriels. Ils sont généralement alcalins et doivent être rincés soigneusement pour éviter les résidus glissants."]},{"title":"Les décapants","content":["Les décapants retirent les couches de cire ou de finis accumulés sur un plancher avant une nouvelle application. Ce sont des produits puissants qui exigent une bonne ventilation et le port d'équipement de protection adapté."]},{"title":"Les neutralisants","content":["Les neutralisants ramènent une surface à un pH neutre après l'utilisation d'un produit acide ou alcalin puissant, ce qui protège la surface et prépare une prochaine étape (comme l'application d'un fini de plancher)."]},{"title":"Les produits écologiques","content":["Les produits écologiques réduisent l'impact environnemental et les risques pour la santé, tout en respectant des certifications reconnues (comme Ecologo ou Green Seal). Ils sont de plus en plus exigés par les clients soucieux de développement durable."]},{"title":"Les dilutions","content":["La majorité des produits professionnels sont concentrés et doivent être dilués selon un ratio précis, indiqué sur l'étiquette. Un produit trop concentré peut endommager les surfaces ou représenter un risque, tandis qu'un produit trop dilué perd son efficacité."]},{"title":"L'entreposage","content":["Les produits doivent être entreposés dans un endroit ventilé, à l'abri de la chaleur et de la lumière directe, dans leur contenant d'origine ou clairement étiqueté, et séparés selon leur compatibilité chimique."]},{"title":"Les incompatibilités","content":["Certains produits ne doivent jamais être mélangés, comme l'eau de Javel et l'ammoniaque, qui produisent un gaz toxique. Toujours vérifier la fiche de données de sécurité avant de combiner ou d'utiliser successivement deux produits différents."]}],"activity":{"label":"Laboratoire","title":"Préparer les solutions","steps":["Chaque participant apprend à lire l'étiquette d'un produit concentré et à calculer le ratio de dilution requis.","Démonstration et pratique de la préparation sécuritaire d'une solution à l'aide d'un poste de dilution ou d'une bouteille graduée.","Vérification par le formateur de chaque solution préparée."]},"quiz":[["Quelle famille de produit sert à éliminer les bactéries et virus ?",["Nettoyant","Désinfectant","Neutralisant","Décapant"],1],["Un produit avec un pH élevé est plutôt efficace contre :",["Le tartre","La rouille","La graisse","Le verre"],2],["Que signifie le « temps de contact » (dwell time) ?",["Le temps de séchage","Le temps que le produit doit rester sur la surface pour être efficace","Le temps de transport","Aucune importance"],1],["Quel produit retire les couches de cire accumulées sur un plancher ?",["Nettoyant général","Décapant","Neutralisant","Désinfectant"],1],["Pourquoi utilise-t-on un neutralisant ?",["Pour parfumer une pièce","Pour ramener une surface à un pH neutre","Pour désinfecter","Pour dégraisser"],1],["Que faut-il vérifier avant de diluer un produit concentré ?",["Sa couleur","Le ratio de dilution recommandé sur l'étiquette","Son prix","Rien de particulier"],1],["Où doivent être entreposés les produits de nettoyage ?",["N'importe où","Dans un endroit ventilé, à l'abri de la chaleur, bien étiquetés","Dans un contenant non identifié","En plein soleil"],1],["Quel mélange est dangereux et peut produire un gaz toxique ?",["Eau et nettoyant","Eau de Javel et ammoniaque","Deux désinfectants identiques","Eau et savon"],1],["Un produit écologique certifié permet de :",["Réduire l'impact environnemental et les risques pour la santé","Nettoyer plus vite dans tous les cas","Remplacer tous les équipements","Éviter toute dilution"],0],["Que risque-t-on si un produit est utilisé trop concentré ?",["Aucun risque","Endommager la surface ou représenter un risque pour la santé","Une meilleure efficacité garantie","Une économie automatique"],1]]},{"num":4,"title":"Les équipements","duree":"2 heures","objectifs":["Reconnaître les principaux équipements de nettoyage","Utiliser chaque équipement correctement et sécuritairement","Entretenir l'équipement pour en prolonger la durée de vie"],"chapters":[{"title":"Aspirateur","content":["L'aspirateur retire la poussière, les saletés sèches et les débris des planchers, tapis et tissus. Il existe des modèles à réservoir, à sac ou dorsaux; le choix du bon filtre et le vidage régulier du réservoir sont essentiels à son efficacité."]},{"title":"Autolaveuse","content":["L'autolaveuse lave, frotte et sèche les grandes surfaces de plancher en une seule passe. Elle augmente considérablement l'efficacité sur les grandes superficies (entrepôts, corridors) et nécessite un entretien régulier des réservoirs et des brosses."]},{"title":"Polisseuse","content":["La polisseuse permet de lustrer, décaper ou récurer les planchers selon le type de brosse ou de tampon utilisé. Elle demande une bonne maîtrise du geste pour éviter d'endommager la surface."]},{"title":"Extracteur","content":["L'extracteur à eau chaude est utilisé pour le nettoyage en profondeur des tapis et des tissus, en injectant une solution puis en l'extrayant avec la saleté qu'elle contient."]},{"title":"Balai","content":["Le balai reste l'outil de base pour le dépoussiérage rapide des planchers avant un lavage humide. Le choix des fibres (souples ou rigides) dépend du type de surface."]},{"title":"Vadrouille","content":["La vadrouille sert au lavage humide des planchers. Les modèles à microfibre offrent un meilleur ramassage de la saleté et nécessitent moins d'eau que les vadrouilles traditionnelles."]},{"title":"Microfibres","content":["Les chiffons et mopes en microfibre captent efficacement la poussière et les bactéries grâce à leurs fibres fines. Un code de couleur (par zone ou par usage) permet d'éviter la contamination croisée entre les différentes surfaces."]},{"title":"Chariot","content":["Le chariot de nettoyage permet de transporter de façon organisée les produits, outils et sacs à déchets nécessaires à un mandat, réduisant les déplacements inutiles et améliorant l'efficacité."]},{"title":"Outils manuels","content":["Raclettes, brosses, grattoirs et autres outils manuels complètent l'équipement motorisé pour les tâches ponctuelles ou les surfaces difficiles d'accès."]}],"activity":{"label":"Atelier","title":"Inspection quotidienne","steps":["Les participants apprennent à réaliser une inspection visuelle et fonctionnelle de chaque équipement avant son utilisation (état des fils, propreté, usure des pièces).","Remplissage d'une fiche d'inspection quotidienne type.","Démonstration du nettoyage et du rangement de l'équipement après usage."]},"quiz":[["Quel équipement lave, frotte et sèche une grande surface en une passe ?",["Balai","Autolaveuse","Extracteur","Chariot"],1],["Quel équipement sert au nettoyage en profondeur des tapis ?",["Polisseuse","Extracteur","Aspirateur","Vadrouille"],1],["Pourquoi utilise-t-on un code de couleur pour les microfibres ?",["Pour la décoration","Pour éviter la contamination croisée","Pour identifier le fabricant","Aucune raison particulière"],1],["Quel équipement permet de lustrer ou décaper un plancher selon le tampon utilisé ?",["Aspirateur","Polisseuse","Chariot","Balai"],1],["Que doit-on vérifier avant d'utiliser un aspirateur ?",["Rien","L'état du filtre et le niveau du réservoir","La couleur","Le prix"],1],["Quel est l'avantage principal d'un chariot de nettoyage bien organisé ?",["Réduire les déplacements inutiles","Aucun avantage","Ralentir le travail","Alourdir la tâche"],0],["Quel outil est utilisé pour le dépoussiérage rapide avant un lavage humide ?",["Extracteur","Balai","Autolaveuse","Polisseuse"],1],["Que doit-on faire après l'utilisation d'un équipement ?",["Le laisser sale","Le nettoyer et le ranger correctement","L'abandonner","Rien de particulier"],1],["Quel document permet de suivre l'état quotidien des équipements ?",["Une facture","Une fiche d'inspection quotidienne","Un contrat client","Aucun document nécessaire"],1],["Quel équipement complète l'équipement motorisé pour les tâches ponctuelles ?",["Les outils manuels","L'autolaveuse","L'extracteur","La polisseuse"],0]]},{"num":5,"title":"Les techniques professionnelles de nettoyage","duree":"4 heures","objectifs":["Appliquer les bonnes techniques de nettoyage selon le type de surface","Adapter sa méthode selon l'environnement","Réaliser un mandat de nettoyage complet dans les règles de l'art"],"chapters":[{"title":"Dépoussiérage","content":["Le dépoussiérage consiste à retirer la poussière des surfaces horizontales et verticales à l'aide d'un chiffon sec ou légèrement humide, en travaillant du haut vers le bas pour éviter de resalir les surfaces déjà nettoyées."]},{"title":"Aspiration","content":["L'aspiration retire la saleté sèche et les débris des planchers et tapis. Il faut adapter la puissance et l'embout selon la surface, et passer méthodiquement pour ne rien oublier."]},{"title":"Nettoyage humide","content":["Le nettoyage humide utilise une solution nettoyante pour retirer la saleté incrustée sur une surface. Il faut utiliser la bonne dilution, rincer si nécessaire et bien assécher pour éviter les traces."]},{"title":"Sanitaires","content":["Le nettoyage des sanitaires suit un protocole strict : désinfection des toilettes, lavabos, miroirs et distributeurs, en respectant le temps de contact des désinfectants et en travaillant du plus propre au plus sale."]},{"title":"Cuisine","content":["L'entretien des cuisines exige une attention particulière à l'hygiène alimentaire : dégraissage des surfaces de cuisson, désinfection des comptoirs et gestion appropriée des déchets alimentaires."]},{"title":"Vitrerie","content":["Le nettoyage des vitres et miroirs sans traces demande une technique précise : application uniforme du produit, raclage en un seul mouvement continu, puis essuyage des contours avec un chiffon sec."]},{"title":"Escaliers","content":["L'entretien des escaliers combine dépoussiérage des marches et des mains courantes, avec une attention particulière à la sécurité (surfaces glissantes, signalisation pendant le lavage)."]},{"title":"Ascenseurs","content":["Les ascenseurs, à fort achalandage, nécessitent un entretien fréquent des parois, boutons et miroirs, ainsi que du plancher, souvent plusieurs fois par jour dans les grands édifices."]},{"title":"Entrées","content":["Les entrées principales sont les premières impressions d'un édifice : elles demandent un entretien fréquent des vitres, tapis et planchers pour gérer la saleté apportée de l'extérieur."]},{"title":"Salles de réunion","content":["L'entretien des salles de réunion inclut le nettoyage des tables, chaises, équipement audiovisuel et la remise en ordre de l'espace entre deux utilisations."]},{"title":"Planchers","content":["Chaque type de plancher (céramique, vinyle, bois, tapis) demande une méthode et des produits spécifiques; utiliser la mauvaise méthode peut endommager la surface de façon permanente."]},{"title":"Surfaces sensibles","content":["Certaines surfaces (bois verni, acier inoxydable, verre, marbre) sont sensibles aux rayures ou à certains produits chimiques et exigent des précautions particulières et des produits adaptés."]}],"activity":{"label":"Laboratoire","title":"Pratique complète","steps":["Mise en place d'un espace simulant plusieurs environnements réels (bureau, sanitaire, cuisine, salle de réunion).","Les participants réalisent, en rotation, un nettoyage complet de chaque poste en appliquant les techniques du module.","Le formateur observe et corrige les gestes en temps réel, puis anime un retour collectif sur les points forts et les points à améliorer."]},"quiz":[["Dans quel ordre doit-on dépoussiérer une pièce ?",["Du bas vers le haut","Du haut vers le bas","Aléatoirement","Aucune importance"],1],["Que faut-il adapter selon la surface lors de l'aspiration ?",["Rien","La puissance et l'embout","Uniquement la couleur de l'appareil","Le prix du produit"],1],["Quelle étape est essentielle après un nettoyage humide pour éviter les traces ?",["Laisser sécher à l'air libre sans essuyer","Bien assécher la surface","Ne rien faire","Ajouter plus d'eau"],1],["Dans quel ordre doit-on nettoyer les sanitaires ?",["Du plus sale au plus propre","Du plus propre au plus sale","Aléatoirement","Peu importe"],1],["Quelle est une priorité particulière lors de l'entretien d'une cuisine ?",["L'hygiène alimentaire","La décoration","Le bruit","Aucune priorité particulière"],0],["Quelle technique permet de nettoyer une vitre sans traces ?",["Frotter dans tous les sens","Application uniforme puis raclage en un mouvement continu","Utiliser un produit non dilué en excès","Ne jamais essuyer les contours"],1],["Quelle attention particulière faut-il porter à l'entretien des escaliers ?",["Aucune","La sécurité (surfaces glissantes, signalisation)","La décoration","La vitesse uniquement"],1],["Pourquoi les ascenseurs nécessitent-ils un entretien fréquent ?",["Ils sont rarement utilisés","Ils sont à fort achalandage","Ils ne se salissent jamais","Aucune raison"],1],["Pourquoi l'entretien des entrées principales est-il important ?",["Ce sont les premières impressions d'un édifice","Ce n'est pas important","Elles ne se salissent jamais","Aucune raison"],0],["Que doit-on faire entre deux utilisations d'une salle de réunion ?",["Rien","Nettoyer et remettre l'espace en ordre","Fermer la salle définitivement","Aucune action requise"],1],["Pourquoi chaque type de plancher demande-t-il une méthode spécifique ?",["Pour compliquer la tâche","Pour éviter d'endommager la surface","Ce n'est pas nécessaire","Aucune raison"],1],["Quelles surfaces sont considérées comme sensibles ?",["Le béton brut","Le bois verni, l'acier inoxydable, le verre, le marbre","Le plancher d'entrepôt","Aucune surface n'est sensible"],1],["Quel est l'objectif principal du laboratoire « Pratique complète » ?",["Mémoriser la théorie seulement","Réaliser un nettoyage complet en appliquant les techniques apprises","Regarder une vidéo","Aucun objectif particulier"],1],["Quelle méthode de travail doit-on privilégier pour être efficace et complet ?",["Travailler au hasard","Suivre une méthode systématique et structurée","Improviser à chaque mandat","Aucune méthode nécessaire"],1],["Que doit faire un professionnel qui n'est pas certain de la méthode appropriée pour une surface ?",["Utiliser n'importe quel produit","Vérifier les recommandations ou demander à son superviseur","Ignorer la surface","Utiliser un décapant systématiquement"],1]]},{"num":6,"title":"Service à la clientèle","duree":"1 heure","objectifs":["Adopter une attitude professionnelle avec la clientèle","Communiquer efficacement dans toutes les situations","Gérer les plaintes avec professionnalisme"],"chapters":[{"title":"Communication","content":["Une communication claire, polie et respectueuse avec le client permet d'éviter les malentendus et de bâtir une relation de confiance durable."]},{"title":"Attitude","content":["Une attitude positive et proactive, même face à des demandes imprévues, contribue directement à la satisfaction du client et à la réputation de l'entreprise."]},{"title":"Ponctualité","content":["Respecter les horaires convenus démontre le sérieux et le professionnalisme du travailleur; tout retard doit être communiqué le plus tôt possible."]},{"title":"Confidentialité","content":["Le respect strict de la confidentialité des lieux, des informations et des occupants est une condition essentielle de la confiance du client."]},{"title":"Professionnalisme","content":["Le professionnalisme se manifeste dans chaque geste : qualité du travail, respect des lieux, discrétion et constance d'un mandat à l'autre."]},{"title":"Gestion des plaintes","content":["Face à une plainte, il faut écouter activement, reconnaître le problème sans se justifier excessivement, et transmettre l'information à son superviseur pour trouver une solution rapide."]},{"title":"Image personnelle","content":["L'image personnelle (tenue, hygiène, langage) reflète directement l'image de l'entreprise auprès du client et doit toujours rester soignée et professionnelle."]}],"activity":{"label":"Jeux de rôle","title":"Mises en situation avec la clientèle","steps":["Les participants sont jumelés en équipes de deux : l'un joue le client, l'autre le professionnel du nettoyage.","Plusieurs scénarios sont proposés : client mécontent, demande de dernière minute, retard imprévu.","Chaque équipe présente sa mise en situation devant le groupe, suivie d'une rétroaction constructive du formateur."]},"quiz":[["Pourquoi la communication avec le client est-elle importante ?",["Elle ne l'est pas","Pour éviter les malentendus et bâtir la confiance","Uniquement pour la forme","Aucune raison"],1],["Que faire en cas de retard ?",["Ne rien dire","Communiquer le retard le plus tôt possible","Ignorer l'horaire","Annuler sans avertir"],1],["Que représente la confidentialité dans la relation avec le client ?",["Une condition essentielle de confiance","Une option facultative","Un détail sans importance","Une contrainte inutile"],0],["Comment doit-on réagir face à une plainte d'un client ?",["Se justifier excessivement","Écouter activement et transmettre l'information au superviseur","Ignorer la plainte","Répondre avec impatience"],1],["Qu'est-ce que le professionnalisme dans ce métier ?",["Un effort ponctuel","Une constance dans la qualité, le respect et la discrétion","Un concept vague sans application","Aucune importance"],1],["L'image personnelle d'un employé reflète :",["Uniquement sa personnalité","L'image de l'entreprise auprès du client","Rien de particulier","Aucun lien avec l'entreprise"],1],["Quelle attitude favorise la satisfaction du client ?",["Une attitude négative","Une attitude positive et proactive","L'indifférence","Le désintérêt"],1],["Quel est l'objectif des jeux de rôle dans ce module ?",["Divertir seulement","Pratiquer des situations réelles de communication avec la clientèle","Remplacer la théorie","Aucun objectif particulier"],1]]},{"num":7,"title":"Qualité et inspections","duree":"2 heures","objectifs":["Comprendre l'importance du contrôle de qualité","Utiliser une checklist d'inspection efficacement","Identifier et corriger les erreurs fréquentes"],"chapters":[{"title":"Pourquoi inspecter ?","content":["L'inspection permet de vérifier que le travail effectué répond aux attentes du client avant de quitter les lieux, plutôt que d'attendre une plainte pour corriger une erreur."]},{"title":"Les checklists","content":["Une checklist structure l'inspection en listant systématiquement chaque zone et chaque tâche à vérifier, assurant qu'aucun élément important n'est oublié."]},{"title":"Le contrôle qualité","content":["Le contrôle de qualité est un processus continu qui compare le résultat obtenu aux standards établis, et qui permet d'ajuster rapidement la méthode de travail si nécessaire."]},{"title":"Les erreurs fréquentes","content":["Certaines erreurs reviennent souvent : oubli de zones peu visibles, résidus de produit non essuyés, mauvaise dilution ou temps de contact non respecté. Les reconnaître permet de les éviter."]},{"title":"Rapports","content":["Un rapport d'inspection documente les résultats constatés, les correctifs apportés et sert de preuve de la qualité du travail auprès du client comme de l'employeur."]},{"title":"Amélioration continue","content":["L'amélioration continue consiste à utiliser les résultats des inspections pour ajuster ses méthodes et progresser constamment dans la qualité de son travail."]}],"activity":{"label":"Exercice","title":"Inspection réelle","steps":["Les participants réalisent une inspection complète d'un espace nettoyé au préalable, à l'aide d'une checklist standardisée.","Ils identifient les non-conformités et proposent les correctifs appropriés.","Un rapport d'inspection est rédigé et présenté au formateur."]},"quiz":[["Pourquoi effectuer une inspection avant de quitter un mandat ?",["Ce n'est pas nécessaire","Pour vérifier que le travail répond aux attentes du client","Pour perdre du temps","Aucune raison"],1],["Que permet une checklist d'inspection ?",["Rien de particulier","Structurer l'inspection et éviter les oublis","Remplacer le travail","Décorer le rapport"],1],["Qu'est-ce que le contrôle de qualité ?",["Un processus continu de comparaison aux standards établis","Une tâche facultative","Une action ponctuelle sans suite","Aucune démarche particulière"],0],["Laquelle de ces erreurs est fréquente lors d'un nettoyage ?",["Trop bien nettoyer","Oubli de zones peu visibles","Trop de rigueur","Aucune erreur possible"],1],["À quoi sert un rapport d'inspection ?",["À documenter les résultats et les correctifs","À rien de particulier","À remplacer la checklist","À décorer le dossier client"],0],["Que signifie l'amélioration continue ?",["Ne jamais changer sa méthode","Ajuster ses méthodes selon les résultats des inspections","Ignorer les retours","Aucun lien avec la qualité"],1],["Quelle est la conséquence possible d'un mauvais respect du temps de contact d'un désinfectant ?",["Aucune conséquence","Une désinfection incomplète","Une meilleure efficacité","Un résultat plus rapide"],1],["Que doit-on faire si une non-conformité est identifiée lors d'une inspection ?",["L'ignorer","Proposer et appliquer un correctif","Ne rien signaler","Attendre la plainte du client"],1],["Quel est le lien entre qualité et satisfaction client ?",["Aucun lien","Une qualité constante favorise la satisfaction et la fidélisation du client","La qualité nuit à la satisfaction","Aucun rapport possible"],1],["Quel outil permet de s'assurer qu'aucune zone n'est oubliée lors d'une inspection ?",["Une checklist","Une facture","Un contrat","Aucun outil nécessaire"],0]]},{"num":8,"title":"Préparation au marché du travail","duree":"1 heure","objectifs":["Préparer un CV et une entrevue efficaces","Comprendre les attentes des employeurs du secteur","Planifier son développement de carrière dans l'industrie"],"chapters":[{"title":"Créer un CV","content":["Un CV efficace pour le secteur du nettoyage met en valeur les compétences pratiques, la fiabilité, l'expérience pertinente et, le cas échéant, le certificat obtenu à la fin de la formation."]},{"title":"Préparer une entrevue","content":["Se préparer à une entrevue implique de connaître l'entreprise, de préparer des exemples concrets de son expérience et de se présenter avec une tenue et une attitude professionnelles."]},{"title":"Comment répondre aux questions","content":["Les réponses aux questions d'entrevue doivent être claires, honnêtes et structurées, en mettant l'accent sur ses forces, sa motivation et sa fiabilité."]},{"title":"Les attentes des employeurs","content":["Les employeurs du secteur recherchent avant tout la ponctualité, la fiabilité, le souci du détail et une bonne capacité à travailler de façon autonome ou en équipe."]},{"title":"L'image professionnelle","content":["Dès le premier contact avec un employeur potentiel, l'image professionnelle (tenue, ponctualité, communication) influence fortement la première impression."]},{"title":"Le développement de carrière","content":["Une fois en poste, il est possible de progresser vers un rôle de superviseur, de gestionnaire de contrat, ou de se diriger vers l'entrepreneuriat en poursuivant son parcours dans les niveaux suivants d'ESSOR Cleaning Academy™."]}],"activity":{"label":"Simulation","title":"Entrevue","steps":["Chaque participant réalise une simulation d'entrevue d'embauche avec le formateur ou un pair, à partir de questions typiques du secteur.","Rétroaction individuelle sur la préparation, la posture et les réponses données.","Remise d'un aide-mémoire des questions fréquentes en entrevue dans le secteur du nettoyage."]},"quiz":[["Que doit mettre en valeur un CV dans le secteur du nettoyage ?",["Uniquement les études","Les compétences pratiques, la fiabilité et le certificat obtenu","Rien de particulier","Les loisirs uniquement"],1],["Comment doit-on se préparer avant une entrevue ?",["Ne rien préparer","Connaître l'entreprise et préparer des exemples concrets","Improviser complètement","Arriver en retard"],1],["Quelles qualités les employeurs recherchent-ils le plus dans ce secteur ?",["La ponctualité et la fiabilité","Aucune qualité particulière","Uniquement l'expérience","Uniquement le diplôme"],0],["Quel est l'impact de l'image professionnelle lors d'un premier contact avec un employeur ?",["Aucun impact","Elle influence fortement la première impression","Elle est sans importance","Elle ne compte qu'après l'embauche"],1],["Quelle est une voie de progression possible après ce programme ?",["Aucune progression possible","Superviseur, gestionnaire de contrat ou entrepreneuriat","Uniquement rester nettoyeur à vie","Changer complètement de secteur"],1],["Comment doit-on répondre aux questions d'entrevue ?",["De façon vague","De façon claire, honnête et structurée","En évitant de répondre","En improvisant sans réfléchir"],1],["Quel est l'objectif de la simulation d'entrevue ?",["Aucun objectif","Pratiquer et recevoir une rétroaction avant une vraie entrevue","Remplacer le CV","Décorer le programme"],1],["Que permet un aide-mémoire des questions fréquentes en entrevue ?",["Rien de particulier","De mieux se préparer aux entrevues futures","De remplacer le CV","D'éviter toute préparation"],1]]}]},{"id":"francais-pro","badge":"Essor Consulting Group","title":"Français professionnel — Communication au travail","desc":"Un cours pratique pour communiquer avec assurance en milieu de travail : se présenter, comprendre les consignes, parler aux clients et lire les documents de travail.","duration":"6 heures","level":"Débutant / Intermédiaire","modules":[{"num":1,"title":"Se présenter et accueillir en milieu de travail","duree":"1 h 30","objectifs":["Se présenter clairement en contexte professionnel","Saluer et accueillir un client ou un collègue","Utiliser les formules de politesse essentielles"],"chapters":[{"title":"Les salutations professionnelles","content":[["Saluer selon le moment","« Bonjour » s'utilise du matin jusqu'à la fin de l'après-midi ; « Bonsoir » en soirée. En contexte professionnel au Canada, « Bonjour » est la salutation la plus sûre et la plus utilisée, même en fin de journée."],["Tutoiement ou vouvoiement ?","Avec un client, un supérieur ou une personne que l'on rencontre pour la première fois, on utilise « vous » (vouvoiement). Le « tu » (tutoiement) se réserve aux collègues proches, et seulement lorsque la personne l'a proposé."],["Formules d'accueil","« Bonjour, bienvenue chez [nom de l'entreprise]. Comment puis-je vous aider ? » — cette formule simple fonctionne dans presque toutes les situations d'accueil."]]},{"title":"Se présenter en une minute","content":[["La structure de base","Nom + rôle + entreprise : « Bonjour, je m'appelle Marie Dubé. Je suis préposée à l'entretien chez ESSOR. » Court, clair, professionnel."],["Parler de son expérience","Utilisez le passé composé pour vos expériences : « J'ai travaillé deux ans dans un hôtel. » et le présent pour votre poste actuel : « Je travaille maintenant dans les bureaux commerciaux. »"],["Les questions courantes en entrevue","« Parlez-moi de vous », « Quelles sont vos disponibilités ? », « Pourquoi voulez-vous ce poste ? » — préparez une réponse simple de deux ou trois phrases pour chacune."]]}],"activity":{"label":"Exercice pratique","title":"Ma présentation en 60 secondes","steps":["Écrivez votre présentation : nom, rôle, expérience (3 à 4 phrases).","Lisez-la à voix haute trois fois.","Enregistrez-vous avec votre téléphone et réécoutez-vous.","Présentez-vous à un proche et demandez ses commentaires."]},"quiz":[["Quelle salutation convient le mieux avec un nouveau client à 15 h ?",["Salut !","Bonjour","Allô","Hé !"],1],["Avec un supérieur rencontré pour la première fois, on utilise…",["le tutoiement (tu)","le vouvoiement (vous)","aucun pronom","son prénom seulement"],1],["Quelle phrase est correcte pour parler d'une expérience passée ?",["Je travaille deux ans dans un hôtel","J'ai travaillé deux ans dans un hôtel","Je travaillerai deux ans dans un hôtel","Je travaillant deux ans dans un hôtel"],1],["La structure de base d'une présentation professionnelle est :",["Âge + adresse + salaire","Nom + rôle + entreprise","Loisirs + famille + études","Salaire + horaire + vacances"],1],["« Comment puis-je vous aider ? » est une formule…",["d'accueil","d'adieu","d'excuse","de plainte"],0]]},{"num":2,"title":"Le vocabulaire du travail et des consignes","duree":"1 h 30","objectifs":["Comprendre les consignes de travail courantes","Maîtriser le vocabulaire des lieux, des outils et des tâches","Demander une clarification poliment"],"chapters":[{"title":"Comprendre une consigne","content":[["Les verbes de consigne","Nettoyer, vider, passer (l'aspirateur), essuyer, désinfecter, ranger, vérifier, remplacer : ces verbes reviennent constamment dans les consignes de travail. À l'impératif : « Videz les poubelles », « Vérifiez les distributeurs »."],["Les mots de fréquence","Toujours, jamais, chaque jour, une fois par semaine, avant de partir, en arrivant : ces expressions précisent quand faire la tâche. « Désinfectez les poignées de porte chaque jour. »"],["Demander de répéter poliment","« Pouvez-vous répéter, s'il vous plaît ? », « Je ne suis pas sûr d'avoir compris, pouvez-vous me montrer ? » — demander une clarification est un signe de professionnalisme, jamais une faiblesse."]]},{"title":"Le vocabulaire des lieux et du matériel","content":[["Les lieux de travail","Le bureau, la salle de réunion, la cuisine, les toilettes, le hall d'entrée, l'entrepôt, le corridor, l'ascenseur, les escaliers, le stationnement."],["Le matériel courant","La vadrouille, le seau, le chiffon (en microfibre), l'aspirateur, le balai, le porte-poussière, les gants, le chariot d'entretien, le produit nettoyant, le désinfectant."],["Les indications de lieu","Sur, sous, dans, à côté de, derrière, devant, au fond de, à gauche, à droite : « Le produit est dans l'armoire, à gauche de l'évier. »"]]}],"activity":{"label":"Exercice pratique","title":"Dictée de consignes","steps":["Demandez à quelqu'un de vous lire cinq consignes de travail.","Écrivez-les, puis vérifiez l'orthographe ensemble.","Reformulez chaque consigne dans vos propres mots."]},"quiz":[["« Videz les poubelles avant de partir » signifie qu'il faut le faire…",["en arrivant le matin","à la fin du quart de travail","une fois par mois","seulement si on a le temps"],1],["Quel objet sert à laver les planchers ?",["Le chiffon","La vadrouille","Le porte-poussière","Les gants"],1],["Quelle phrase est la façon la plus professionnelle de demander une clarification ?",["Quoi ?","Répète !","Pouvez-vous répéter, s'il vous plaît ?","Je n'ai rien compris."],2],["« Le produit est dans l'armoire, à gauche de l'évier. » Où est le produit ?",["Sur l'évier","Sous l'armoire","Dans l'armoire","Derrière l'évier"],2],["« Chaque jour » est une expression de…",["lieu","fréquence","quantité","politesse"],1]]},{"num":3,"title":"Communiquer avec les clients et les collègues","duree":"1 h 30","objectifs":["Répondre poliment à une demande ou à une plainte","Signaler un problème à son superviseur","Utiliser le téléphone et les messages texte professionnels"],"chapters":[{"title":"Répondre à une demande ou à une plainte","content":[["Rester calme et poli","Face à une plainte : écouter sans interrompre, remercier la personne, proposer une solution. « Merci de me l'avoir signalé. Je m'en occupe tout de suite. »"],["Dire non poliment","Quand une demande dépasse votre rôle : « Je ne suis pas autorisé à faire cela, mais je vais transmettre votre demande à mon superviseur. » On ne dit jamais simplement « non, ce n'est pas mon travail »."],["Les phrases utiles","« Bien sûr, avec plaisir. » · « Je vérifie et je reviens vers vous. » · « Désolé pour ce désagrément. » · « C'est corrigé, merci de votre patience. »"]]},{"title":"Signaler un problème et écrire un message","content":[["Signaler un problème","Structure simple : quoi + où + quand. « Il y a une fuite d'eau dans les toilettes du 2e étage, je l'ai remarquée vers 9 h. » Toujours signaler immédiatement les bris, dégâts et situations dangereuses."],["Le message texte professionnel","Court et complet : « Bonjour M. Tremblay, le ménage du bureau 204 est terminé. La porte est verrouillée. Bonne journée. » On évite les abréviations (svp au lieu de « stp »), et on se relit avant d'envoyer."],["Le courriel simple","Objet clair + salutation + message en 2 ou 3 phrases + formule de fin (« Cordialement », « Merci et bonne journée ») + nom complet."]]}],"activity":{"label":"Simulation","title":"Jeu de rôle : la plainte d'un client","steps":["Avec un partenaire : l'un joue un client mécontent (tache oubliée sur un tapis), l'autre l'employé.","L'employé applique la méthode : écouter, remercier, proposer une solution.","Inversez les rôles, puis discutez de ce qui a bien fonctionné."]},"quiz":[["Face à une plainte d'un client, la première chose à faire est de…",["se défendre","écouter sans interrompre","appeler la police","ignorer la plainte"],1],["Quelle réponse est professionnelle quand une demande dépasse votre rôle ?",["« Non, ce n'est pas mon travail. »","« Débrouillez-vous. »","« Je vais transmettre votre demande à mon superviseur. »","« Demandez à quelqu'un d'autre. »"],2],["Pour signaler un problème, la structure recommandée est :",["quoi + où + quand","qui + combien + pourquoi","salaire + horaire + tâche","nom + âge + adresse"],0],["Dans un message texte professionnel, on doit…",["utiliser beaucoup d'abréviations","écrire court, complet, et se relire","écrire en majuscules","éviter de saluer"],1],["« Désolé pour ce désagrément » sert à…",["s'excuser auprès d'un client","demander une augmentation","refuser une tâche","commencer une réunion"],0]]},{"num":4,"title":"Lire les documents de travail et la sécurité","duree":"1 h 30","objectifs":["Lire une étiquette de produit et une affiche de sécurité","Comprendre un horaire et une feuille de tâches","Connaître le vocabulaire de la santé et sécurité"],"chapters":[{"title":"Étiquettes, pictogrammes et affiches","content":[["Les mots d'avertissement","Danger, attention, corrosif, inflammable, toxique, porter des gants, bien aérer, ne pas mélanger : ces mots sur une étiquette doivent être compris avant d'utiliser un produit."],["Les affiches courantes","« Plancher mouillé », « Sortie de secours », « Interdiction de fumer », « Port des gants obligatoire » : savoir lire ces affiches est une exigence de sécurité au travail."],["En cas de doute","Si vous ne comprenez pas une étiquette ou une consigne de sécurité, arrêtez-vous et demandez. « Je ne comprends pas cette étiquette, pouvez-vous m'expliquer ? » peut éviter un accident."]]},{"title":"Horaires, feuilles de tâches et formulaires","content":[["Lire un horaire","Lun, mar, mer, jeu, ven, sam, dim ; quart de jour, de soir, de nuit ; « de 17 h à 21 h » ; congé, remplacement, temps supplémentaire : le vocabulaire essentiel des horaires."],["La feuille de tâches","Une liste de tâches à cocher : chaque case cochée confirme que la tâche est faite. On coche seulement ce qui est réellement terminé — c'est une question d'honnêteté professionnelle."],["Remplir un formulaire simple","Nom, prénom, date (jour/mois/année), adresse, code postal, numéro de téléphone, signature : savoir remplir ces champs sans aide est un objectif clé de ce module."]]}],"activity":{"label":"Atelier","title":"Lecture d'étiquettes réelles","steps":["Prenez trois produits nettoyants de votre domicile.","Repérez sur chaque étiquette : le mot d'avertissement, les protections exigées, une interdiction.","Écrivez pour chaque produit une phrase : « Ce produit est …, il faut … et il ne faut jamais … »"]},"quiz":[["Que faire si vous ne comprenez pas une étiquette de produit ?",["Utiliser le produit quand même","Arrêter et demander une explication","Jeter le produit","Mélanger avec de l'eau pour l'adoucir"],1],["« Quart de soir » de 17 h à 21 h signifie que vous travaillez…",["le matin","l'après-midi et le soir","la nuit","la fin de semaine seulement"],1],["Sur une feuille de tâches, on coche une case quand…",["on commence la tâche","la tâche est réellement terminée","on n'a pas le temps","le superviseur regarde"],1],["Le mot « inflammable » sur une étiquette indique un produit qui…",["peut prendre feu","est sans danger","sent bon","est comestible"],0],["Quelle affiche avertit d'un risque de glissade ?",["Sortie de secours","Plancher mouillé","Interdiction de fumer","Port des gants obligatoire"],1]]}]}];
const PASS = 70;

/* ---------- storage ---------- */
function loadUsers(){ try{return JSON.parse(localStorage.getItem('essor_lms_users')||'{}')}catch(e){return{}} }
function saveUsers(u){ localStorage.setItem('essor_lms_users', JSON.stringify(u)); }
function sessionEmail(){ return localStorage.getItem('essor_lms_session'); }
function currentUser(){ const e=sessionEmail(); if(!e) return null; return loadUsers()[e]||null; }
function saveUser(u){ const users=loadUsers(); users[u.email]=u; saveUsers(users); }

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function courseById(id){ return COURSES.find(c=>c.id===id); }
function prog(u,cid){ u.progress=u.progress||{}; u.progress[cid]=u.progress[cid]||{read:{},scores:{}}; return u.progress[cid]; }
function chapKey(m,ci){ return 'm'+m.num+'c'+ci; }
function moduleDone(u,c,m){ const p=prog(u,c.id); const allRead=m.chapters.every((_,i)=>p.read[chapKey(m,i)]); const q=(m.quiz&&m.quiz.length)?(p.scores[m.num]!==undefined&&p.scores[m.num]>=PASS):true; return allRead&&q; }
function moduleStarted(u,c,m){ const p=prog(u,c.id); return m.chapters.some((_,i)=>p.read[chapKey(m,i)])||p.scores[m.num]!==undefined; }
function coursePct(u,c){
  let total=0,done=0;
  c.modules.forEach(m=>{ total+=m.chapters.length; const p=prog(u,c.id);
    m.chapters.forEach((_,i)=>{ if(p.read[chapKey(m,i)])done++; });
    if(m.quiz&&m.quiz.length){ total++; if(p.scores[m.num]!==undefined&&p.scores[m.num]>=PASS)done++; }
  });
  return total?Math.round(done/total*100):0;
}
function courseComplete(u,c){ return c.modules.every(m=>moduleDone(u,c,m)); }

/* ---------- router ---------- */
let view={name:'auth'};
function go(name,a,b){ view={name,a,b}; render(); window.scrollTo(0,0); }
function render(){
  const app=document.getElementById('app');
  const u=currentUser();
  document.getElementById('userbox').classList.toggle('hidden',!u);
  if(u){ document.getElementById('username').textContent=u.name; document.getElementById('avatar').textContent=(u.name||'?').trim().charAt(0).toUpperCase(); }
  if(!u){ app.innerHTML=authView(); return; }
  if(view.name==='auth') view={name:'dashboard'};
  if(view.name==='dashboard') app.innerHTML=dashView(u);
  else if(view.name==='course') app.innerHTML=courseView(u,courseById(view.a));
  else if(view.name==='module') app.innerHTML=moduleView(u,courseById(view.a),view.b);
  else if(view.name==='quiz') app.innerHTML=quizView(u,courseById(view.a),view.b);
  else if(view.name==='cert') app.innerHTML=certView(u,courseById(view.a));
}

/* ---------- auth ---------- */
let authTab='login';
function authView(){
  return `
  <div class="auth-grid">
    <div class="auth-pitch">
      <h1>Votre espace de <span>formation en ligne</span></h1>
      <p>Suivez les formations du Groupe ESSOR à votre rythme : lisez les modules, validez vos connaissances avec des quiz notés et obtenez votre certificat de réussite.</p>
      <ul>
        <li><span class="chk">✓</span> Programme 1 — Foundations of Professional Cleaning (ESSOR Cleaning Academy™)</li>
        <li><span class="chk">✓</span> Français professionnel — communication au travail</li>
        <li><span class="chk">✓</span> Suivi de progression automatique et quiz de validation</li>
        <li><span class="chk">✓</span> Certificat imprimable à la fin de chaque formation</li>
      </ul>
    </div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="${authTab==='login'?'active':''}" onclick="authTab='login';render()">Connexion</button>
        <button class="${authTab==='signup'?'active':''}" onclick="authTab='signup';render()">Inscription</button>
      </div>
      <div class="auth-err" id="autherr"></div>
      ${authTab==='signup'?`
      <div class="frow"><label>Nom complet</label><input id="f-name" placeholder="Votre nom"></div>`:''}
      <div class="frow"><label>Courriel</label><input id="f-email" type="email" placeholder="vous@exemple.com"></div>
      <div class="frow"><label>Mot de passe</label><input id="f-pass" type="password" placeholder="••••••••"></div>
      <button class="btn btn-primary" onclick="${authTab==='login'?'doLogin()':'doSignup()'}">${authTab==='login'?'Se connecter':'Créer mon compte'}</button>
    </div>
  </div>`;
}
function doSignup(){
  const name=document.getElementById('f-name').value.trim();
  const email=document.getElementById('f-email').value.trim().toLowerCase();
  const pass=document.getElementById('f-pass').value;
  const err=document.getElementById('autherr');
  if(!name||!email||!pass){ err.textContent='Veuillez remplir tous les champs.'; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Courriel invalide.'; return; }
  if(pass.length<4){ err.textContent='Mot de passe trop court (4 caractères min.).'; return; }
  const users=loadUsers();
  if(users[email]){ err.textContent='Un compte existe déjà avec ce courriel.'; return; }
  users[email]={name,email,pw:btoa(pass),progress:{},created:new Date().toISOString()};
  saveUsers(users); localStorage.setItem('essor_lms_session',email);
  go('dashboard');
}
function doLogin(){
  const email=document.getElementById('f-email').value.trim().toLowerCase();
  const pass=document.getElementById('f-pass').value;
  const err=document.getElementById('autherr');
  const u=loadUsers()[email];
  if(!u||u.pw!==btoa(pass)){ err.textContent='Courriel ou mot de passe incorrect.'; return; }
  localStorage.setItem('essor_lms_session',email);
  go('dashboard');
}
function logout(){ localStorage.removeItem('essor_lms_session'); view={name:'auth'}; render(); }

/* ---------- dashboard ---------- */
function dashView(u){
  return `
  <div class="page-head"><h2>Bonjour, ${esc(u.name.split(' ')[0])} 👋</h2>
  <p>Choisissez une formation pour commencer ou reprendre là où vous étiez rendu.</p></div>
  <div class="course-grid">
    ${COURSES.map(c=>{
      const pct=coursePct(u,c), full=courseComplete(u,c);
      return `
      <div class="course-card">
        <div class="cc-top"><span class="cc-badge">${esc(c.badge)}</span><h3>${esc(c.title)}</h3></div>
        <div class="cc-body">
          <p>${esc(c.desc)}</p>
          <div class="cc-meta"><span>⏱ ${esc(c.duration)}</span><span>📚 ${c.modules.length} modules</span><span>🎓 ${esc(c.level)}</span></div>
          <div class="plabel"><span>Progression</span><span><b>${pct}%</b></span></div>
          <div class="pbar"><div style="width:${pct}%"></div></div>
          <div class="cc-actions">
            <button class="btn btn-primary btn-sm" onclick="go('course','${c.id}')">${pct===0?'Commencer':full?'Revoir la formation':'Continuer'}</button>
            ${full?`<button class="btn btn-ghost btn-sm" onclick="go('cert','${c.id}')">🎓 Mon certificat</button>`:''}
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------- course ---------- */
function courseView(u,c){
  const pct=coursePct(u,c), full=courseComplete(u,c);
  return `
  <div class="crumb"><a href="#" onclick="go('dashboard');return false;">← Tableau de bord</a></div>
  <div class="page-head"><h2>${esc(c.title)}</h2><p>${esc(c.desc)}</p></div>
  <div style="max-width:420px;margin-bottom:26px">
    <div class="plabel"><span>Progression globale</span><span><b>${pct}%</b></span></div>
    <div class="pbar"><div style="width:${pct}%"></div></div>
  </div>
  ${full?`<div class="quiz-cta" style="margin-bottom:24px"><h4>🎉 Formation complétée !</h4><p>Félicitations, vous avez terminé tous les modules et réussi tous les quiz.</p><button class="btn btn-primary" onclick="go('cert','${c.id}')">Voir mon certificat</button></div>`:''}
  <div class="mod-list">
    ${c.modules.map(m=>{
      const done=moduleDone(u,c,m), started=moduleStarted(u,c,m);
      const st=done?['st-done','Terminé ✓']:started?['st-prog','En cours']:['st-todo','À faire'];
      return `
      <div class="mod-item" onclick="go('module','${c.id}',${m.num})">
        <div class="mod-num ${done?'done':''}">${done?'✓':m.num}</div>
        <div class="mod-info"><h4>Module ${m.num} — ${esc(m.title)}</h4><span>⏱ ${esc(m.duree)} · ${m.chapters.length} chapitres${m.quiz&&m.quiz.length?' · quiz '+m.quiz.length+' questions':''}</span></div>
        <span class="mod-state ${st[0]}">${st[1]}</span>
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------- module ---------- */
let openChap=-1;
function courseModule(c,num){ return c.modules.find(m=>m.num===num); }
function moduleView(u,c,num){
  const m=courseModule(c,num); const p=prog(u,c.id);
  const score=p.scores[m.num];
  return `
  <div class="crumb"><a href="#" onclick="go('dashboard');return false;">Tableau de bord</a> › <a href="#" onclick="go('course','${c.id}');return false;">${esc(c.title)}</a> › Module ${m.num}</div>
  <div class="page-head"><h2>Module ${m.num} — ${esc(m.title)}</h2><p>⏱ Durée indicative : ${esc(m.duree)}</p></div>
  <div class="obj-box"><h4>Objectifs du module</h4><ul>${m.objectifs.map(o=>`<li><span class="chk">✓</span>${esc(o)}</li>`).join('')}</ul></div>
  ${m.chapters.map((ch,i)=>{
    const read=!!p.read[chapKey(m,i)];
    return `
    <div class="chap ${openChap===i?'open':''}" id="chap${i}">
      <div class="chap-head" onclick="toggleChap(${i})">
        <div class="chap-tick ${read?'read':''}">${read?'✓':''}</div>
        <h4>Chapitre ${i+1} · ${esc(ch.title)}</h4>
        <span class="chev">▶</span>
      </div>
      <div class="chap-body">
        ${ch.content.map(item=>Array.isArray(item)?`<p><b>${esc(item[0])}</b> — ${esc(item[1])}</p>`:`<p>${esc(item)}</p>`).join('')}
        ${read?'':`<button class="btn btn-primary btn-sm" onclick="markRead('${c.id}',${m.num},${i})">✓ Marquer comme lu</button>`}
      </div>
    </div>`;
  }).join('')}
  ${m.activity?`
  <div class="act-box">
    <span class="tag">${esc(m.activity.label)}</span>
    <h4>${esc(m.activity.title)}</h4>
    <ul>${m.activity.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
    <div class="note">Cette activité pratique se réalise en présentiel ou chez vous — elle n'est pas notée en ligne.</div>
  </div>`:''}
  ${m.quiz&&m.quiz.length?`
  <div class="quiz-cta">
    <h4>Quiz du module ${m.num}</h4>
    <p>${m.quiz.length} questions · note de passage : ${PASS} %${score!==undefined?'':' · vous pouvez le reprendre autant de fois que nécessaire'}</p>
    <button class="btn btn-primary" onclick="go('quiz','${c.id}',${m.num})">${score!==undefined?'Reprendre le quiz':'Commencer le quiz'}</button>
    ${score!==undefined?`<br><span class="score-pill ${score>=PASS?'st-done':'st-prog'}" style="border:none">Dernier résultat : ${score} % ${score>=PASS?'— Réussi ✓':'— Non réussi, réessayez'}</span>`:''}
  </div>`:''}
  <div style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap">
    <button class="btn btn-ghost btn-sm" onclick="go('course','${c.id}')">← Retour aux modules</button>
    ${num<c.modules.length?`<button class="btn btn-primary btn-sm" onclick="openChap=-1;go('module','${c.id}',${num+1})">Module suivant →</button>`:''}
  </div>`;
}
function toggleChap(i){ openChap=(openChap===i?-1:i); render(); }
function markRead(cid,mnum,ci){
  const u=currentUser(); const c=courseById(cid); const m=courseModule(c,mnum);
  prog(u,cid).read[chapKey(m,ci)]=true; saveUser(u);
  openChap=(ci+1<m.chapters.length)?ci+1:-1;
  render();
}

/* ---------- quiz ---------- */
let quizState=null;
function quizView(u,c,num){
  const m=courseModule(c,num);
  if(!quizState||quizState.cid!==c.id||quizState.m!==num){ quizState={cid:c.id,m:num,answers:{},submitted:false,score:0}; }
  const q=m.quiz;
  if(quizState.submitted){
    const pct=quizState.score;
    return `
    <div class="crumb"><a href="#" onclick="quizState=null;go('module','${c.id}',${num});return false;">← Retour au module ${num}</a></div>
    <div class="quiz-result">
      <div class="big">${pct} %</div>
      <p>${pct>=PASS?'Bravo, quiz réussi ! ✓':'Note de passage : '+PASS+' %. Relisez le module et réessayez.'}</p>
    </div>
    ${q.map((qq,qi)=>{
      const sel=quizState.answers[qi];
      return `<div class="qcard"><h4>${qi+1}. ${esc(qq[0])}</h4>
      ${qq[1].map((opt,oi)=>{
        let cls=''; if(oi===qq[2])cls='correct'; else if(sel===oi)cls='wrong';
        return `<div class="qopt ${cls}"><span>${oi===qq[2]?'✓':(sel===oi?'✗':'•')}</span><span>${esc(opt)}</span></div>`;
      }).join('')}</div>`;
    }).join('')}
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="quizState=null;go('module','${c.id}',${num})">← Retour au module</button>
      ${pct<PASS?`<button class="btn btn-primary btn-sm" onclick="quizState=null;go('quiz','${c.id}',${num})">Réessayer le quiz</button>`:
        (num<c.modules.length?`<button class="btn btn-primary btn-sm" onclick="quizState=null;openChap=-1;go('module','${c.id}',${num+1})">Module suivant →</button>`:
        `<button class="btn btn-primary btn-sm" onclick="quizState=null;go('course','${c.id}')">Terminer la formation</button>`)}
    </div>`;
  }
  return `
  <div class="crumb"><a href="#" onclick="quizState=null;go('module','${c.id}',${num});return false;">← Retour au module ${num}</a></div>
  <div class="page-head"><h2>Quiz — Module ${num}</h2><p>${q.length} questions · note de passage : ${PASS} %</p></div>
  ${q.map((qq,qi)=>`
  <div class="qcard"><h4>${qi+1}. ${esc(qq[0])}</h4>
    ${qq[1].map((opt,oi)=>`
    <label class="qopt"><input type="radio" name="q${qi}" ${quizState.answers[qi]===oi?'checked':''} onchange="quizState.answers[${qi}]=${oi}"><span>${esc(opt)}</span></label>`).join('')}
  </div>`).join('')}
  <button class="btn btn-primary" onclick="submitQuiz('${c.id}',${num})">Soumettre mes réponses</button>`;
}
function submitQuiz(cid,num){
  const c=courseById(cid); const m=courseModule(c,num); const q=m.quiz;
  const unanswered=q.findIndex((_,qi)=>quizState.answers[qi]===undefined);
  if(unanswered!==-1){ alert('Veuillez répondre à la question '+(unanswered+1)+' avant de soumettre.'); return; }
  let good=0; q.forEach((qq,qi)=>{ if(quizState.answers[qi]===qq[2])good++; });
  const pct=Math.round(good/q.length*100);
  quizState.submitted=true; quizState.score=pct;
  const u=currentUser(); const p=prog(u,cid);
  if(p.scores[num]===undefined||pct>p.scores[num]) p.scores[num]=pct;
  saveUser(u); render(); window.scrollTo(0,0);
}

/* ---------- certificate ---------- */
function certView(u,c){
  if(!courseComplete(u,c)){ go('course',c.id); return ''; }
  const d=new Date().toLocaleDateString('fr-CA',{year:'numeric',month:'long',day:'numeric'});
  return `
  <div class="crumb"><a href="#" onclick="go('course','${c.id}');return false;">← Retour à la formation</a></div>
  <div class="cert">
    <div class="small">${esc(c.badge)}</div>
    <h2>Certificat de réussite</h2>
    <p>Ce certificat est décerné à</p>
    <div class="name">${esc(u.name)}</div>
    <p>pour avoir complété avec succès la formation</p>
    <div class="course">${esc(c.title)}</div>
    <p>${esc(c.duration)} de formation · ${c.modules.length} modules · quiz de validation réussis</p>
    <div class="sig-row">
      <div class="sig">Direction — Groupe ESSOR</div>
      <div class="sig">Délivré le ${d}</div>
    </div>
  </div>
  <div class="cert-actions"><button class="btn btn-primary" onclick="window.print()">🖨 Imprimer / Enregistrer en PDF</button></div>`;
}

render();
</script>
